# UNBUILT / UNTESTED: written on a machine without Rust. Run `cargo check` first; expect to fix small API drift.
[package]
name = "aura-desktop"
version = "0.1.0"
description = "Aura Next desktop shell (Tauri v2)"
edition = "2021"
rust-version = "1.90"

[lib]
name = "aura_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "sync", "time"] }
notify = "6"
keyring = "3"
sha2 = "0.10"
hex = "0.4"
getrandom = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
futures-util = "0.3"
url = "2"
sysinfo = "0.30"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
