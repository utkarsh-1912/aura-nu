<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Offline - Aura Next</title>
    <style>
      :root { --bg: #fafafc; --fg: #0f172a; --muted: #475569; --accent: #4f46e5; }
      @media (prefers-color-scheme: dark) { :root { --bg: #09090b; --fg: #f4f4f5; --muted: #a1a1aa; --accent: #818cf8; } }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font-family: Inter, system-ui, -apple-system, sans-serif; }
      main { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 24px; padding-bottom: max(24px, env(safe-area-inset-bottom)); text-align: center; }
      img { width: 64px; height: 64px; border-radius: 16px; }
      h1 { margin: 0; font-size: 22px; }
      p { margin: 0; max-width: 32ch; color: var(--muted); line-height: 1.5; }
      button { margin-top: 8px; min-height: 44px; padding: 0 20px; border: 0; border-radius: 12px; background: var(--accent); color: #fff; font: inherit; font-weight: 600; }
    </style>
  </head>
  <body>
    <main>
      <img src="/logo.png" alt="" />
      <h1>You are offline</h1>
      <p>Aura could not reach the network and this page is not available offline yet. Notes you already opened are still saved on this device.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
